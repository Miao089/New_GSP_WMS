<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSP资质核查 - 医疗器械 GSP 合规 WMS & TMS 原型系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Shell -->
  <div class="app-container">
    
    <!-- Main Content Area -->
    <main class="main-content">
      
      <!-- View Content -->
      <div class="view-wrapper">
        <section id="view-qualifications" class="content-view active-view">
          
          <div class="tab-container">
            <div class="tabs">
              <button class="tab-btn active" id="tab-btn-supplier">供应商资质</button>
              <button class="tab-btn" id="tab-btn-client">客户准入资质</button>
              <button class="tab-btn" id="tab-btn-material">医疗器械注册证</button>
            </div>
            
            <!-- Tab 1: Supplier Quals -->
            <div id="supplier-qual" class="tab-pane active">
              <div class="glass-panel">
                <div class="panel-toolbar" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                  <h3 style="font-size:14px; font-weight:600;"><i class="fa-solid fa-truck-field"></i> 供应商《医疗器械经营许可证》库</h3>
                  <button class="btn btn-primary btn-sm" id="reset-quals-btn"><i class="fa-solid fa-arrow-rotate-left"></i> 重置资质数据</button>
                </div>
                <div class="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>供应商名称</th>
                        <th>许可证号</th>
                        <th>经营范围（分类代码）</th>
                        <th>有效期至</th>
                        <th>状态</th>
                        <th>资质卡控</th>
                      </tr>
                    </thead>
                    <tbody id="supplier-qual-table-body">
                      <!-- Rendered by JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Tab 2: Client Quals -->
            <div id="client-qual" class="tab-pane">
              <div class="glass-panel">
                <div class="panel-toolbar" style="margin-bottom:15px;">
                  <h3 style="font-size:14px; font-weight:600;"><i class="fa-solid fa-hospital"></i> 客户《医疗器械经营许可证》资质</h3>
                </div>
                <div class="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>客户名称</th>
                        <th>许可证/备案证号</th>
                        <th>核准经营范围（分类代码）</th>
                        <th>有效期至</th>
                        <th>状态</th>
                        <th>资质卡控</th>
                      </tr>
                    </thead>
                    <tbody id="client-qual-table-body">
                      <!-- Rendered by JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Tab 3: Device Regs -->
            <div id="material-qual" class="tab-pane">
              <div class="glass-panel">
                <div class="panel-toolbar" style="margin-bottom:15px;">
                  <h3 style="font-size:14px; font-weight:600;"><i class="fa-solid fa-certificate"></i> 医疗器械注册证 / 备案凭证</h3>
                </div>
                <div class="table-container">
                  <table>
                    <thead>
                      <tr>
                        <th>产品编号</th>
                        <th>器械通用名称</th>
                        <th>规格型号</th>
                        <th>分类代码</th>
                        <th>注册证/备案号</th>
                        <th>注册证有效期</th>
                        <th>状态</th>
                      </tr>
                    </thead>
                    <tbody id="material-qual-table-body">
                      <!-- Rendered by JS -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>

        </section>
      </div>
    </main>

  </div>

  <script type="module" src="layout.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
